<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI智能工作台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033}.app{display:flex;height:100vh}.side{width:220px;background:#111827;color:#fff;padding:18px 12px;display:flex;flex-direction:column}.logo{font-size:20px;font-weight:800;padding:8px 10px 20px}.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#263244;color:#fff}.bottom{margin-top:auto;color:#94a3b8;font-size:12px;padding:10px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.modelbox{display:flex;gap:10px;align-items:center}.modelbox select{padding:8px;border:1px solid #dbe1ea;border-radius:8px}.status{font-size:12px;color:#f59e0b}.content{flex:1;display:flex;min-height:0}.chat{flex:1;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:30px 7%}.welcome{max-width:850px;margin:40px auto}.welcome h2{font-size:28px}.welcome p{color:#667085}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.tool{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer}.card span,.tool div{font-size:12px;color:#667085}.msg{max-width:850px;margin:0 auto 18px;display:flex;gap:10px}.avatar{width:34px;height:34px;border-radius:9px;background:#e8eefc;display:flex;align-items:center;justify-content:center;flex:none}.user .avatar{background:#111827;color:#fff}.bubble{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#f0f4ff}.composer{padding:14px 7% 20px}.inputwrap{max-width:850px;margin:auto;background:#fff;border:1px solid #d9e0ea;border-radius:14px;padding:10px}.inputwrap textarea{width:100%;border:0;outline:0;resize:none;min-height:62px;font:inherit}.actions{display:flex;justify-content:space-between}.send,.save{border:0;background:#111827;color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer}.right{width:270px;background:#fff;border-left:1px solid #e5e7eb;padding:18px}.tool{margin:9px 0}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.panel{width:500px;max-width:92%;background:#fff;border-radius:16px;padding:22px}.panel input{width:100%;padding:10px;border:1px solid #dbe1ea;border-radius:8px;margin:8px 0 16px}@media(max-width:900px){.right{display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{width:70px}.logo{font-size:0}.logo:after{content:"AI";font-size:20px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">AI智能工作台</div><div class="nav">
<button class="active" data-mode="总控 AI">🧠 总控 AI</button><button data-mode="标书助手">📑 标书助手</button><button data-mode="文案助手">✍️ 文案助手</button><button data-mode="文件助手">📁 文件助手</button><button data-mode="研究助手">🔎 研究助手</button><button data-mode="数据助手">📊 数据助手</button><button data-mode="编程助手">💻 编程助手</button><button data-mode="图片助手">🖼️ 图片助手</button></div><div class="nav" style="margin-top:18px"><button id="models">⚙️ 模型管理</button><button id="settings">🔧 连接设置</button></div><div class="bottom">AI Workbench · v2.0</div></aside>
<main class="main"><header class="top"><h1 id="title">总控 AI</h1><div class="modelbox"><span class="status" id="status">● 未连接</span><select id="model"><option>gpt-5.6-luna</option><option>gpt-5.6-terra</option><option>gpt-5.6-sol</option></select></div></header><div class="content"><section class="chat"><div class="messages" id="messages"><div class="welcome" id="welcome"><h2>你好，我是你的 AI 工作台总控。</h2><p>选择左侧助手，或直接告诉我你要完成什么工作。</p><div class="cards"><div class="card" onclick="quick('帮我写一份采购项目的服务实施方案')"><b>📑 写标书</b><br><span>服务方案、资格文件</span></div><div class="card" onclick="quick('帮我写一份正式工作总结')"><b>✍️ 写材料</b><br><span>总结、汇报、方案</span></div><div class="card" onclick="quick('帮我分析这个项目应该怎么推进')"><b>🔎 做研究</b><br><span>分析、整理、决策</span></div><div class="card" onclick="quick('帮我设计一个Excel数据分析方案')"><b>📊 数据分析</b><br><span>表格、统计、分析</span></div></div></div></div><div class="composer"><div class="inputwrap"><textarea id="input" placeholder="输入你的任务……"></textarea><div class="actions"><span style="font-size:12px;color:#98a2b3">Enter发送 · Shift+Enter换行</span><button class="send" id="send">发送</button></div></div></div></section><aside class="right"><h3>常用功能</h3><div class="tool" onclick="quick('请把这个复杂任务拆成详细执行步骤')"><b>🧩 任务拆解</b><div>拆成可执行步骤</div></div><div class="tool" onclick="quick('请用正式、专业、适合提交给采购方的语气改写')"><b>📝 专业改写</b><div>商务、公文表达</div></div><div class="tool" onclick="quick('请检查这份内容是否有遗漏，并列出需要补充的部分')"><b>🔍 内容检查</b><div>遗漏、风险、逻辑</div></div><div class="tool" onclick="quick('请给我一个可直接执行的工作计划')"><b>📅 工作计划</b><div>计划与时间安排</div></div></aside></div></main></div>
<div class="modal" id="modal"><div class="panel"><button style="float:right;border:0;background:none;font-size:22px" onclick="closeModal()">×</button><h2>连接设置</h2><p style="font-size:13px;color:#667085">API Key 不放在网页里，而放在后端 Worker 的 Secret 中。</p><label>后端 API 地址</label><input id="endpoint" placeholder="https://你的-worker.workers.dev/chat"><button class="save" onclick="saveSettings()">保存</button></div></div>
<script>
const state={mode:"总控 AI",endpoint:localStorage.getItem("ai_endpoint")||""},$=x=>document.getElementById(x);function updateStatus(){$("status").textContent=state.endpoint?"● 已配置后端":"● 未连接";$("status").style.color=state.endpoint?"#16a34a":"#f59e0b"}function add(role,text){$("welcome")?.remove();let e=document.createElement("div");e.className="msg "+role;e.innerHTML='<div class="avatar">'+(role==="user"?"你":"AI")+'</div><div class="bubble"></div>';e.querySelector(".bubble").textContent=text;$("messages").appendChild(e);$("messages").scrollTop=$("messages").scrollHeight;return e.querySelector(".bubble")}function quick(t){$("input").value=t;sendMessage()}document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.mode=b.dataset.mode;$("title").textContent=state.mode});$("settings").onclick=()=>{$("endpoint").value=state.endpoint;$("modal").classList.add("show")};function closeModal(){$("modal").classList.remove("show")}function saveSettings(){state.endpoint=$("endpoint").value.trim();localStorage.setItem("ai_endpoint",state.endpoint);closeModal();updateStatus()}$("models").onclick=()=>alert("当前支持 OpenAI 模型选择；后续可扩展 Claude、Gemini、DeepSeek、通义等。");async function sendMessage(){let t=$("input").value.trim();if(!t)return;add("user",t);$("input").value="";$("send").disabled=true;let b=add("assistant","正在调用 AI…");if(!state.endpoint){b.textContent="请先点击“连接设置”，填写后端 Worker 地址。";$("send").disabled=false;return}try{let r=await fetch(state.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,mode:state.mode,model:$("model").value})});let d=await r.json();if(!r.ok)throw Error(d.error||"请求失败");b.textContent=d.output||"AI没有返回内容"}catch(e){b.textContent="调用失败："+e.message}finally{$("send").disabled=false;$("messages").scrollTop=$("messages").scrollHeight}}$("send").onclick=sendMessage;$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});updateStatus();
</script></body></html>
